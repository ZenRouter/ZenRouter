name: Release & Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag (e.g. v0.5.58)"
        required: true
        default: "v0.5.57"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    # Only run on tags or manual dispatch; branch pushes just validate workflow visibility
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install tests deps
        run: cd tests && npm ci || npm install

      - name: Install CLI deps
        run: npm --prefix cli ci || npm --prefix cli install

      - name: Run Test Suite
        run: npm test
        env:
          JWT_SECRET: test-jwt-secret-at-least-32-chars-long-for-ci-simulation
          ZENROUTER_PEER_TOKEN: test-peer-token-for-ci-1234567890abcdef
          NODE_ENV: test

      - name: Build Next.js & Standalone Assets
        run: npm run build
        env:
          JWT_SECRET: test-jwt-secret-at-least-32-chars-long-for-ci-simulation
          NEXT_PHASE: phase-production-build

      - name: Build and Pack CLI Package
        run: npm run cli:pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          name: "🌿 ZenRouter ${{ github.ref_name || github.event.inputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            zenrouter-*.tgz
            install.sh
            docker-compose.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish CLI to npm
        if: env.NPM_TOKEN != ''
        run: |
          cd cli
          CURRENT_VER=$(node -p "require('./package.json').version")
          NPM_VER=$(npm view @joyccn/zenrouter version 2>/dev/null || echo "0.0.0")
          if [ "$CURRENT_VER" = "$NPM_VER" ]; then
            echo "Version $CURRENT_VER is already published to npm. Skipping npm publish."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
